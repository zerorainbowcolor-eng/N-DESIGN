    .sc-head { text-align: center; margin-bottom: 2.5rem; }

    .sc-title { font-size:clamp(1.25rem, 3vw, 1.75rem); font-weight:700; letter-spacing:.08em; margin-top:.6rem; line-height:1.6; }
    .sc-main { background:#f6f4ef; border-radius:0; overflow:hidden; margin-bottom:4.5rem; }
    .sc-main img { width:100%; height:auto; display:block; }
    .sc-main--cols { aspect-ratio:16 / 10; display:flex; justify-content:center; gap:4%; padding:6% 5% 0; }
    .sc-main--cols .sc-col { flex:0 0 26%; align-self:flex-start; box-shadow:0 6px 24px rgba(0,0,0,0.14); }
    .sc-main--fit { background:#eef2f8 url(images/works/sc-bg.webp?v=3) center / cover no-repeat; } /* 白〜淡い青のサテン調背景 */
    .sc-main--fit .sc-col { overflow:hidden; position:relative; }
    .sc-col-stack { position:relative; }
    .sc-col-stack img { width:100%; height:auto; display:block; }
    .sc-col-stack .sc-fv { position:absolute; top:0; left:0; }
    .sc-full-cap { text-align:center; font-size:.75rem; color:#999; letter-spacing:.1em; margin-bottom:1.25rem; }
    .sc-full { position:relative; max-width:1100px; margin:0 auto 5rem; }
    .sc-stack { position:relative; width:54%; margin:0 auto; box-shadow:0 10px 40px rgba(0,0,0,0.12); }
    .sc-stack img { width:100%; height:auto; display:block; }
    .sc-stack .sc-fv { position:absolute; top:0; left:0; width:100%; height:auto; object-fit:cover; }
    .sc-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
    .sc-line { fill:none; stroke:#aaa; stroke-width:1; }
    .sc-dot { fill:#fff; stroke:#888; stroke-width:1.2; }
    .sc-note { position:absolute; width:21%; background:#fff; box-shadow:0 4px 18px rgba(0,0,0,0.1); padding:1.1rem 1.2rem; font-size:.8rem; line-height:1.9; color:#555; margin:0; }
    .sc-info { max-width:760px; margin:0 auto; border-top:1px solid #e5e5e5; padding-top:3rem; }
    .sc-info .label { font-size:1rem; padding-left:.8rem; border-left:3px solid #e5025a; margin-bottom:.6rem; }

<script>
  // 各作品のスライド定義
  // 通常画像は文字列、縦スクロールスライドは {type:'scroll', images:[...]} で指定
  const extraImages = {
    1: [{ type: 'scroll', images: ['images/work1A.webp', 'images/work1B.webp'] }],
    2: [{ type: 'scroll', images: ['images/work2A.webp', 'images/work2B.jpg'] }],
    3: [{ type: 'scroll', images: ['images/work3A.webp', 'images/work3B.webp'] }],
    5: [{ type: 'scroll', images: ['images/work5A.webp', 'images/work5B.jpg'] }],
    10: [{ type: 'scroll', images: ['images/work4A.webp', 'images/work4B.webp'] }],
  };

  let currentSlide = 0;
  let slideImages = [];

  function buildSlider(images) {
    const track = document.getElementById('slider-track');
    const dots  = document.getElementById('slider-dots');
    track.innerHTML = '';
    dots.innerHTML  = '';
    slideImages = images;

    images.forEach((item, i) => {
      const slide = document.createElement('div');
      slide.className = 'w-full shrink-0';
      slide.style.minWidth = '100%';

      if (item && item.type === 'scroll') {
        // 縦スクロールスライド
        slide.style.cssText = 'min-width:100%; height:70vw; max-height:500px; overflow-y:auto; background:#111;';
        item.images.forEach(src => {
          // PC用高画質版（-pc.jpg）があればpictureで出し分け
          const pcSrc = src.replace(/\.(jpg|webp)$/i, '-pc.$1');
          const picture = document.createElement('picture');
          const source = document.createElement('source');
          source.media = '(min-width: 640px)';
          source.srcset = pcSrc;
          picture.appendChild(source);
          const img = document.createElement('img');
          img.src = src;
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';
          img.style.cssText = 'width:100%; display:block;';
          picture.appendChild(img);
          slide.appendChild(picture);
        });
        // スクロール促すラベル
        const label = document.createElement('div');
        label.style.cssText = 'position:sticky; bottom:8px; text-align:center; pointer-events:none;';
        label.innerHTML = '<span style="background:rgba(0,0,0,0.6);color:#fff;font-size:0.7rem;padding:4px 10px;border-radius:0;">↓ スクロールして見る</span>';
        slide.appendChild(label);
      } else {
        // 通常画像スライド
        const img = document.createElement('img');
        img.src = item;
        img.alt = '';
        img.className = 'w-full h-auto';
        slide.appendChild(img);
      }

      track.appendChild(slide);

      const dot = document.createElement('button');
      dot.className = `w-2 h-2 rounded-full transition ${i === 0 ? 'bg-tiffany' : 'bg-white/60'}`;
      dot.onclick = () => goToSlide(i);
      dots.appendChild(dot);
    });

    document.getElementById('slide-prev').classList.toggle('hidden', images.length <= 1);
    document.getElementById('slide-next').classList.toggle('hidden', images.length <= 1);
    dots.classList.toggle('hidden', images.length <= 1);
    goToSlide(0);
  }

  function goToSlide(n) {
    currentSlide = Math.max(0, Math.min(n, slideImages.length - 1));
    document.getElementById('slider-track').style.transform = `translateX(-${currentSlide * 100}%)`;
    document.querySelectorAll('#slider-dots button').forEach((d, i) => {
      d.className = `w-2 h-2 rounded-full transition ${i === currentSlide ? 'bg-tiffany' : 'bg-white/60'}`;
    });
    document.getElementById('slide-prev').style.visibility = currentSlide === 0 ? 'hidden' : 'visible';
    document.getElementById('slide-next').style.visibility = currentSlide === slideImages.length - 1 ? 'hidden' : 'visible';

    // 表示中スライドの画像を確実に読み込む（lazyの保険）
    const activeSlide = document.getElementById('slider-track').children[currentSlide];
    if (activeSlide) {
      activeSlide.querySelectorAll('img[loading="lazy"]').forEach(img => { img.loading = 'eager'; });
    }
  }

  function slideMove(dir) { goToSlide(currentSlide + dir); }

  const portfolioData = [
    { category: 'LP制作', title: 'LINEマーケティングコンサルタント養成講座 無料説明会LP', concept: '難しいイメージを払拭し、「自分にもできそう」というワクワク感と、在宅で自由に働ける未来のイメージを直感的に伝えるクリーンなデザイン。<br><br><span style="font-size:0.875rem; font-weight:700; color:#001638;">デザイン構成</span><br>カラー：信頼感と清潔感を与えるブルーを基調に、行動を促すオレンジをアクセントに採用。実績などの重要数字はゴールドで強調。<br>レイアウト：スマホ閲覧を意識した縦長構成。FVで実績をアピールして離脱を防ぎ、受講生の声や図解を交えてテンポよく解説。<br>CVR対策：ユーザーの熱量が高まるセクションの直後に、目立つCTAボタンを最適配置。', target: 'メイン：在宅ワークや副業、フリーランスを目指す未経験者（30代〜40代男女）\n悩み：「特別な資格やセンスがない」「何から始めていいか分からない」と一歩を踏み出せずにいる層。', tools: 'Photoshop' },
    { category: 'LP制作', title: '酵素ドリンク LP', concept: '酵素ドリンクに対してハードルを感じている層に向け、みずみずしいフルーツのビジュアルや日常に溶け込むライフスタイル写真を使用。ストイックで苦しいイメージを一新し、「美味しく、無理なく続けられる自分へのご褒美」としての楽しさと、無添加処方の安心感を両立させたデザイン。<br><br><span style="font-size:0.875rem; font-weight:700; color:#001638;">デザイン構成</span><br>カラー：自然由来の瑞々しさを伝えるアースグリーンを基調に、購買意欲を高めるフレッシュなオレンジをアクセントに採用。お悩みセクションには一転して黒背景を使い、視覚的なコントラストを生んでいます。<br>レイアウト：スマホでのスクロールを飽きさせない緩急のある構成。ファーストビューで「30%OFF・2,940円」というオファーを印象付けた後、お悩み共感→5つの選ばれる理由から、愛用者の声へと自然に納得させるストーリー設計。<br>CVR対策：手軽に試せる「定期縛りなし」のQ&Aで最後の不安を払拭し、熱量が高まるタイミングで鮮やかなグリーンの大きめのCTAボタンへ誘導。', target: 'メイン：美容や健康への意識が高く、手軽にインナーケアを取り入れたい20代〜40代の男女（主に女性）。\n悩み：「食生活の乱れや肌荒れ・むくみが気になる」「体が重いけれど、無理なダイエットやファスティングは続かない」と悩む多忙な層。', tools: 'Photoshop' },
    { category: 'HP制作', title: 'CCC木村事務所様　コーポレートサイト【リニューアル】', intro: 'コンタクトセンターの品質改善を行う「CCC 木村オフィス」様よりご相談をいただき、ホームページのリニューアルを担当いたしました。', concept: '「大手にはない柔軟性」と「代表自らが直接コミットする安心感（属人性の強み）」を前面に出しつつ、プロフェッショナルな風格を両立させたデザイン。<br><br><span style="font-size:0.875rem; font-weight:700; color:#001638;">デザイン構成</span><br>カラー： 知性と信頼感を象徴するディープネイビーをベースにした配色。<br><br>レイアウト： 木村様の「顔が見える安心感」と「確かな実績・ノウハウ」を掛け合わせた構成。FVで専門性を明示した後、代表のプロフィールや想いを丁寧に語りつつ、提供サービスや課題解決プロセスを論理的に整理した、納得感のあるストーリー設計。<br><br>CVR対策： 「まずは壁打ちから相談したい」という心理的ハードルを下げるため、気軽な初回相談やお問い合わせへ繋げる導線をヘッダーと各セクションに配置。', target: 'メイン： 顧客エンゲージメントの向上や、コールセンターの品質・生産性に課題を抱える中小・ベンチャー企業の経営層やカスタマーサクセス責任者。\n悩み： 「大手のコンサルは費用が高く、誰が担当になるか分からず不安」「自社の状況に寄り添って、泥臭く一緒に現場を改善してくれるプロを探している」という層。', tools: 'WIX' },
    { category: 'LP制作', title: 'ランディングページ 02', concept: 'スマホファーストで設計し、スクロールに連動した演出でユーザーを自然にCTAへ誘導します。', target: 'スマートフォンユーザーの20〜40代', tools: 'Figma / Studio' },
    { category: 'LP制作', title: '整体・サロンオーナー向けセミナー LP', concept: '集客や売上低迷に悩むサロン経営者に向け、実績のある講師のビジュアルを押し出し信頼感を構築。「労力半分で売上2倍」という圧倒的なメリットをストレートに提示。<br><br><span style="font-size:0.875rem; font-weight:700; color:#001638;">デザイン構成</span><br>カラー：清潔感があり前向きな印象を与えるホワイトをベースに構築。文字やアクセントには鮮やかなオレンジを採用することで、参加者の挑戦を力強く応援し、一歩を踏み出すエネルギーを感じさせる配色に仕上げています。CTAボタンには、視線を惹きつける鮮やかなグリーンを使いコントラストを生んでいます。<br><br>レイアウト：ファーストビューで「参加費0円」の強力なオファーを印象付けた後、黒背景で悩みを浮き彫りに。そこから選ばれる3つの理由から受講生のリアルな声へと繋げ、納得感を持って申し込める王道のストーリー設計。<br><br>CVR対策：「通常15,000円→0円」の限定感で背中を押し、顔写真を多く載せることで信頼性を担保。熱量が高まるフッターで、立体感のある大きめの緑色CTAボタンへ誘導。', target: 'メイン：個人経営の整体院やリラクゼーションサロンのオーナー、今後独立・開業を目指す層。\n悩み：「技術はあるのに集客やリピートが増えない」「休みがなく体力的・精神的に限界だが、売上が伸び悩んでいる」。', tools: 'Photoshop' },
    { category: 'サムネイル', title: 'YouTube サムネイル 01', concept: 'クリック率を高めるために、インパクトのあるビジュアルとテキスト配置を徹底的に検証しました。', target: 'YouTube視聴者・新規チャンネル登録者', tools: 'Photoshop / Canva' },
    { category: 'チラシ制作', title: 'イベントチラシ 01', concept: 'A4両面のチラシ。日程・会場・申し込み方法を見やすく整理し、行動を促す構成にしました。', target: 'イベント参加を検討している地域住民', tools: 'Illustrator' },

    { category: 'HP制作（架空サイト）', title: '株式会社ネクストブリッジ コーポレートサイト', concept: '企業の先進性と信頼感を両立させ、ビジネスの「次の架け橋（Next Bridge）」となる安心感を直感的に伝えるクリーンで洗練されたモダンデザイン。<br><br><span style="font-size:0.875rem; font-weight:700; color:#001638;">デザイン構成</span><br>カラー： 誠実さと知性を感じさせるネイビー・ブルーをベースに、洗練された印象を与えるモダンなカラーで統一。重要なキーワードやコンバージョンへ導く要素には、視認性の高いアクセントカラーを配置。<br>レイアウト： ユーザーがストレスなく情報を読み進められるよう、十分なホワイトスペース（余白）を確保したスマートなレイアウト。ファーストビュー（FV）で企業の強みやビジョンを明確に打ち出し、ストーリー性を持たせたセクション構成で直感的な理解を促す。<br>CVR対策： サービス内容や導入メリットに納得したベストなタイミングで、ユーザーがスムーズにお問い合わせやアクションに移れるよう、目を引くCTA（行動喚起）ボタンを戦略的に配置。', target: 'メイン： 信頼できるビジネスパートナーや、確かなソリューションを求めているBtoBのクライアント（経営者、事業責任者、担当者層）。\n悩み： 「既存のシステムや体制に課題があるが、どこに変革を依頼すべきか分からない」「先進的な取り組みをしたいが、信頼できる企業を選びたい」と感じている層。', tools: 'Photoshop / HTML, CSS' },
    { category: 'バナー制作', title: '未経験歓迎 求人バナー', concept: '未経験の20代女性の転職不安を解消し、「歓迎される職場」への一歩を後押しする求人バナー。<br><br><span style="font-size:0.875rem; font-weight:700; color:#001638;">デザイン構成</span><br>青〜ピンクのグラデーションで清潔感と女性親和性を両立。大きなメインコピーで求人内容を瞬時に伝え、笑顔の人物写真で入社後のポジティブなイメージを補強。「残業月平均10時間以下」などの具体数値で不安を払拭し、黄色帯のCTAボタンでクリックへ誘導する、上から下への自然なストーリー導線が特徴。', target: '事務職未経験の20代女性。残業や即戦力要求への不安を持つ転職・就職検討層。', tools: 'Photoshop' },

    { category: 'バナー制作', title: 'マネーリテラシー講座 バナー', concept: '将来のお金に不安を感じる若手社会人に向けて、金融知識を基礎から学べることをわかりやすく伝え、受講への心理的ハードルを下げる講座告知バナー。<br><br><span style="font-size:0.875rem; font-weight:700; color:#001638;">デザイン構成</span><br>白を基調としたシンプルなレイアウトに、ブルー・ピンク・イエローのアクセントカラーを加えることで、親しみやすさと視認性を両立。中央の「マネーリテラシー講座」を大きく配置し、講座内容を瞬時に認識できる構成とした。左右の人物イラストは受講者像を表現し、共感を促進。さらに、紙幣・コイン・貯金箱・カードなどのイラストを散りばめることで、お金に関する学びを直感的にイメージできるよう設計した。「全6回」「受講料無料」の情報を目立つ位置に配置し、参加メリットを明確に伝えながら申し込みへの導線を強化した。', target: '20代・30代の社会人。貯蓄や資産形成、家計管理に関心はあるものの、お金に関する知識に自信がなく、基礎から学びたいと考えている層。', tools: 'Photoshop' },

    { category: 'バナー制作', title: '女子旅 プロモーションバナー', concept: '仲間との旅行で生まれる特別な思い出を前面に打ち出した、グループ旅行を後押しするプロモーションバナー。<br><br><span style="font-size:0.875rem; font-weight:700; color:#001638;">デザイン構成</span><br>ミントブルーを背景に、明るく親しみやすい雰囲気を統一して表現した。「仲間と一生の思い出を作ろう！」というメインコピーを六角形のふきだし形状で中央に大きく配置し、旅への期待感を高めた。周囲には飛行機・バス・紅葉・ラーメン・ビール・浴衣姿の女性・自撮りする友人グループなど、旅の多彩なシーンをちりばめることで、グループ旅行のワクワク感を視覚的に表現した。ポラロイド風の写真素材やガーランド・きらめきのイラストを散りばめることで、SNS映えを意識したポップでかわいらしい世界観に仕上げた。', target: '20代〜30代の女性グループ。友人や同僚と一緒に旅行を計画しており、観光・グルメ・温泉など多彩な体験を楽しみたいと考えている層を想定した。', tools: 'Photoshop' },
    { category: 'HP制作', title: 'キャニング・アンド・アソシエイツ様　コーポレートサイト【トップページリニューアル】', concept: 'コーポレートサイトのトップページのリニューアルです。英語研修を「語学」ではなく、グローバルビジネスで成果を出すための「人材育成」として伝える、知的で信頼感のあるデザインに一新しました。研修を受けた先の「英語で自信を持って活躍する姿」が直感的に伝わり、企業の担当者が安心して相談できるサイトをめざしました。<br><br><span style="font-size:0.875rem; font-weight:700; color:#001638;">デザイン構成</span><br>カラー：落ち着いたチャコールグレーとアイボリーを基調にして、上質で信頼感のある雰囲気に。行動を促すCTAには赤を、受講者数や満足度などの実績はゴールドで強調しました。<br><br>レイアウト：<br>・FVには、研修を受けた人が自信を持って英語で話している場面の写真を採用し、受講後の姿＝ベネフィットが伝わるようにしました。<br>・「累計20万人」「世界70カ国」「満足度96%」の実績は月桂樹のバッジにしてFVの写真に重ね、ひと目で目立つようにしました。<br>・導入企業のスライダーを設置し、大手企業の導入実績を見せることで安心感を持ってもらえる構成にしました。<br><br>CVR対策：画面右下に「まずは無料相談してみる」の追従ボタンを設置し、どの位置まで読み進めてもすぐ申し込めるようにしました。あわせて「無料相談」と「資料ダウンロード」の2つの入口をFV・ページ中盤・最下部に配置し、検討段階に合わせて選べるようにしています。', target: 'メイン：グローバル人材の育成を担う、企業の人事・研修担当者や経営層。\n悩み：「英語研修をしているが成果が見えない」「海外進出は進むのに、対応できる人材が育っていない」と感じている層。\nサブ：英語でのプレゼンや交渉に不安があり、短期間で実務力を高めたいビジネスパーソン個人。', tools: 'Photoshop / Figma など' },

  // 縦長画像＋説明カード
  function buildFull(sc, title) {
    const wrap = document.getElementById('sc-full');
    const stack = document.createElement('div');
    stack.className = 'sc-stack';
    sc.full.forEach((f, i) => {
      const img = document.createElement('img');
      img.src = f.src;
      img.width = 1800; img.height = f.h;
      img.alt = i === 0 ? title + ' サイト全体' : '';
      img.loading = i === 0 ? 'eager' : 'lazy';
      img.decoding = 'async';
      stack.appendChild(img);
    });
    if (sc.fv) {
      const fv = document.createElement('img');
      fv.src = sc.fv.src;
      fv.alt = '';
      fv.className = 'sc-fv';
      fv.style.aspectRatio = '1800 / ' + sc.fv.h;
      stack.appendChild(fv);
    }
    wrap.appendChild(stack);
    if (!sc.notes) return;

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'sc-svg');
    svg.setAttribute('aria-hidden', 'true');
    wrap.appendChild(svg);
    const cards = sc.notes.map(n => {
      const c = document.createElement('p');
      c.className = 'sc-note';
      c.textContent = n.text;
      wrap.appendChild(c);
      return c;
    });

    function layout() {
      const W = wrap.clientWidth;
      const sp = window.innerWidth < 640;
      const sL = stack.offsetLeft, sW = stack.offsetWidth, sH = stack.offsetHeight;
      const lastBottom = { L: -Infinity, R: -Infinity };
      svg.innerHTML = '';
      sc.notes.forEach((n, i) => {
        const c = cards[i];
        const side = sp ? 'R' : n.side;
        const px = sL + n.x * sW, py = n.y * sH;
        const h = c.offsetHeight, cw = c.offsetWidth;
        // 重なりを避けて下にずらす
        const top = Math.max(py - h / 2, lastBottom[side] + (sp ? 8 : 12), 0);
        lastBottom[side] = top + h;
        const left = side === 'R' ? W - cw : 0;
        c.style.top = top + 'px';
        c.style.left = left + 'px';
        const ex = side === 'R' ? left : left + cw;
        const ey = Math.min(Math.max(py, top + 14), top + h - 14);
        const line = document.createElementNS(NS, 'polyline');
        // 線と点は画像の外だけ：点は画像のふち（該当部分と同じ高さ）に置く
        const edge = side === 'R' ? sL + sW : sL;
        const out = side === 'R' ? edge + 10 : edge - 10;
        line.setAttribute('points', `${edge},${py} ${out},${py} ${ex},${ey}`);
        line.setAttribute('class', 'sc-line');
        svg.appendChild(line);
        const dot = document.createElementNS(NS, 'circle');
        dot.setAttribute('cx', edge); dot.setAttribute('cy', py); dot.setAttribute('r', sp ? 2.5 : 3.5);
        dot.setAttribute('class', 'sc-dot');
        svg.appendChild(dot);
      });
    }
    layout();
    window.addEventListener('resize', layout);
    stack.querySelectorAll('img').forEach(img => img.addEventListener('load', layout));
    if (document.fonts) document.fonts.ready.then(layout);
  }

        scTitle.textContent = data.title;

        // LP全体（full＋FV）を縦にN等分し、左の列から上→下の続きとして並べる。
        // 枠（16:10、上6%・下5%の余白）に縦が収まる範囲で、列が一番太くなる列数（4か3）を選ぶ
        const box = mainImgEl.parentElement;
        box.classList.add('sc-main--cols', 'sc-main--fit');
        box.setAttribute('role', 'img');
        box.setAttribute('aria-label', data.title + ' メイン画像（ページ全体）');
        box.innerHTML = '';
        const totalH = sc.full.reduce((s, f) => s + f.h, 0), r = totalH / 1800; // 縦÷横
        // 列数：長いLPは4列、短いLPは3列。列は横幅いっぱいに並べ、枠の高さは「列の高さの95%」に合わせる
        // （列の下5%ほどが枠の下からはみ出し、その分は枠で切る）
        const gap = 3, N = r > 6 ? 4 : 3;
        const colW = N === 4 ? 22 : 28;                          // 内側の幅(枠の90%)=100としたときの列幅
        const colH = colW * r / N * 0.9;                         // 列の高さ（枠の幅=100基準）
        box.style.aspectRatio = '100 / ' + (6 + colH * 0.95);   // 上余白6%＋列の95%
        box.style.gap = gap + '%';
        for (let k = 0; k < N; k++) {
          const c = document.createElement('div');
          c.className = 'sc-col';
          c.style.flex = '0 0 ' + colW + '%';
          c.style.aspectRatio = '1800 / ' + (totalH / N);
          const st = document.createElement('div');
          st.className = 'sc-col-stack';
          st.style.transform = 'translateY(' + (-100 * k / N) + '%)';
          sc.full.forEach(f => {
            const img = document.createElement('img');
            img.src = f.src; img.alt = ''; img.decoding = 'async';
            img.width = 1800; img.height = f.h;
            st.appendChild(img);
          });
          if (sc.fv) {
            const fv = document.createElement('img');
            fv.src = sc.fv.src; fv.alt = ''; fv.className = 'sc-fv';
            fv.style.aspectRatio = '1800 / ' + sc.fv.h;
            st.appendChild(fv);
          }
          c.appendChild(st);
          box.appendChild(c);
        }
      } else if (sc.mainCols) {
        // 画面キャプチャを4列に並べたメインビジュアル
        const box = mainImgEl.parentElement;
        box.classList.add('sc-main--cols');
        box.setAttribute('role', 'img');
        box.setAttribute('aria-label', data.title + ' メイン画像');
        box.innerHTML = '';
        sc.mainCols.forEach(col => {
          const c = document.createElement('div');
          c.className = 'sc-col';
          col.forEach(src => {
            const img = document.createElement('img');
            img.src = src; img.alt = ''; img.decoding = 'async';
            c.appendChild(img);
          });
          box.appendChild(c);
        });
      } else {
        mainImgEl.src = sc.main;
        mainImgEl.alt = data.title + ' メイン画像';
      }
      buildFull(sc, data.title);
      // スライダー・小見出しを隠し、下の情報を中央寄せのブロックに
      const wrap = document.getElementById('detail-wrap');
      wrap.firstElementChild.style.display = 'none';
      document.getElementById('detail-category').style.display = 'none';
      document.getElementById('detail-title').style.display = 'none';
      const info = wrap.lastElementChild;
      info.classList.add('sc-info');
      info.querySelectorAll(':scope > .space-y-5 > div').forEach(d => d.classList.add('sc-block'));
      info.querySelector('.mt-10').style.justifyContent = 'center';
      document.querySelector('.pt-28.max-w-4xl').classList.replace('max-w-4xl', 'max-w-6xl');
    } else {
      buildSlider([mainImg, ...extras]);
